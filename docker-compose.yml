services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recall
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recall}
    ports:
      - "5432:5432"
    volumes:
      - recall_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/recall
      DB_USER: recall
      DB_PASSWORD: ${DB_PASSWORD:-recall}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - recall_ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  recall_postgres:
  recall_ollama: